[versions]
# Android build
agp                    = "8.4.2"
kotlin                 = "2.0.0"
ksp                    = "2.0.0-1.0.24"
compileSdk             = "35"
minSdk                 = "26"
targetSdk              = "35"

# AndroidX core
core-ktx               = "1.13.1"
lifecycle              = "2.8.3"
activity-compose       = "1.9.0"
navigation-compose     = "2.7.7"

# Compose
compose-bom            = "2024.06.00"

# Hilt (DI)
hilt-android           = "2.51.1"
hilt-navigation-compose = "1.2.0"

# Coroutines
coroutines             = "1.8.1"

# Supabase
supabase               = "2.5.0"
ktor                   = "2.3.12"

# Room (local DB)
room                   = "2.6.1"

# DataStore
datastore              = "1.1.1"

# OSMDroid (OpenStreetMap)
osmdroid               = "6.1.18"

# Serialization
kotlinx-serialization  = "1.7.1"

# Testing
junit                  = "4.13.2"
junit-ext              = "1.2.1"
espresso               = "3.6.1"
mockk                  = "1.13.11"
turbine                = "1.1.0"
coroutines-test        = "1.8.1"
arch-core-testing      = "2.2.0"

[libraries]
# AndroidX
androidx-core-ktx               = { group = "androidx.core",              name = "core-ktx",                version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx  = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose       = { group = "androidx.activity",          name = "activity-compose",         version.ref = "activity-compose" }
androidx-navigation-compose     = { group = "androidx.navigation",        name = "navigation-compose",       version.ref = "navigation-compose" }

# Compose BOM
compose-bom                     = { group = "androidx.compose",           name = "compose-bom",              version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling              = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-test-manifest        = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
compose-ui-test-junit4          = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material",  name = "material-icons-extended" }

# Hilt
hilt-android                    = { group = "com.google.dagger",          name = "hilt-android",             version.ref = "hilt-android" }
hilt-android-compiler           = { group = "com.google.dagger",          name = "hilt-android-compiler",    version.ref = "hilt-android" }
hilt-navigation-compose         = { group = "androidx.hilt",              name = "hilt-navigation-compose",  version.ref = "hilt-navigation-compose" }

# Coroutines
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",  version.ref = "coroutines-test" }

# Supabase
supabase-postgrest              = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt",          version.ref = "supabase" }
supabase-auth                   = { group = "io.github.jan-tennert.supabase", name = "gotrue-kt",             version.ref = "supabase" }
supabase-realtime               = { group = "io.github.jan-tennert.supabase", name = "realtime-kt",           version.ref = "supabase" }
supabase-storage                = { group = "io.github.jan-tennert.supabase", name = "storage-kt",            version.ref = "supabase" }
ktor-client-android             = { group = "io.ktor",                    name = "ktor-client-android",       version.ref = "ktor" }
ktor-client-core                = { group = "io.ktor",                    name = "ktor-client-core",          version.ref = "ktor" }

# Room
room-runtime                    = { group = "androidx.room",              name = "room-runtime",              version.ref = "room" }
room-ktx                        = { group = "androidx.room",              name = "room-ktx",                 version.ref = "room" }
room-compiler                   = { group = "androidx.room",              name = "room-compiler",             version.ref = "room" }
room-testing                    = { group = "androidx.room",              name = "room-testing",              version.ref = "room" }

# DataStore
datastore-preferences           = { group = "androidx.datastore",         name = "datastore-preferences",     version.ref = "datastore" }

# OSMDroid
osmdroid-android                = { group = "org.osmdroid",               name = "osmdroid-android",          version.ref = "osmdroid" }

# Kotlinx Serialization
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Testing
junit                           = { group = "junit",                      name = "junit",                     version.ref = "junit" }
androidx-junit                  = { group = "androidx.test.ext",          name = "junit",                     version.ref = "junit-ext" }
androidx-espresso-core          = { group = "androidx.test.espresso",     name = "espresso-core",             version.ref = "espresso" }
mockk                           = { group = "io.mockk",                   name = "mockk",                     version.ref = "mockk" }
turbine                         = { group = "app.cash.turbine",           name = "turbine",                   version.ref = "turbine" }
arch-core-testing               = { group = "androidx.arch.core",         name = "core-testing",              version.ref = "arch-core-testing" }

[plugins]
android-application             = { id = "com.android.application",       version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",  version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android                    = { id = "com.google.dagger.hilt.android", version.ref = "hilt-android" }
ksp                             = { id = "com.google.devtools.ksp",       version.ref = "ksp" }
